groups:
  - name: rd-guard
    rules:
      - alert: RDGuardObserveLatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(rd_guard_observe_duration_seconds_bucket[5m]))) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RD Guard p99 observation latency is elevated
          description: The five-minute p99 observe latency is above 50 ms.

      - alert: RDGuardEnteredFault
        expr: increase(rd_guard_state_transitions_total{to_state="FAULT"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: RD Guard entered FAULT
          description: Inspect audit-sink health, application logs, and the active incident.

      - alert: RDGuardCompromised
        expr: rd_guard_safety_state{state="COMPROMISED"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: RD Guard is in terminal COMPROMISED state
          description: Follow incident response; do not attempt in-process recovery.

      - alert: RDGuardBlockedActionsSpike
        expr: sum(rate(rd_guard_action_decisions_total{decision="BLOCK"}[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: RD Guard block rate is elevated
          description: Investigate the blocked action rate and verify expected policy behavior.
