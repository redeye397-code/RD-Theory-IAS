[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rd_theory"
version = "11.2.0"
description = "RD Theory - Self-Limiting AI Safety Architecture"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ecdsa",
]

[tool.setuptools]
py-modules = [
    "rd_theory",
    "rd_theory_v3",
    "rd_theory_v4_final",
    "rd_theory_v5",
    "rd_theory_v6",
    "rd_theory_v7",
    "rd_theory_v8",
    "rd_guard_v9",
    "rd_guard",
    "rd_executor",
    "_rd_guard_actions",
    "_rd_guard_risk_engine",
    "_rd_guard_schema",
    "_rd_guard_executor",
    "_rd_state_machine",
    "_rd_metrics",
    "_rd_metrics_server",
    "rd_vault",
    "rd_webhook",
    "_rd_vault_core",
    "risk_engine_v9",
    "actions_v9",
    "rd_platform_visualization",
    "demo_v3_sequence",
    "demo_v4_quad_locked",
]
