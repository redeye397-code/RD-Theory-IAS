<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RD Theory V10.0.0 Dashboard</title>
    <style>
      :root {
        --bg: #07111f;
        --bg-2: #0d1a2d;
        --panel: rgba(15, 24, 39, 0.88);
        --panel-strong: rgba(12, 20, 31, 0.96);
        --cyan: #5eead4;
        --blue: #61a5ff;
        --pink: #ff5d8f;
        --gold: #f7b267;
        --purple: #9b7bff;
        --text: #ebf7ff;
        --muted: #a8bed1;
        --green: #7cf7a3;
        --danger: #ff6b6b;
        --border: rgba(94, 234, 212, 0.35);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at top, rgba(97, 165, 255, 0.12), transparent 25%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        color: var(--text);
        font-family: Inter, Segoe UI, Tahoma, Arial, sans-serif;
      }

      body {
        padding: 32px 20px 60px;
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
      }

      .hero {
        background: linear-gradient(180deg, rgba(16, 23, 37, 0.96), rgba(10, 17, 29, 0.94));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px 26px;
        box-shadow: 0 0 32px rgba(94, 234, 212, 0.08);
      }

      .eyebrow {
        color: var(--cyan);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      h1 {
        font-size: clamp(2.2rem, 5vw, 4.2rem);
        margin: 0;
        letter-spacing: -0.06em;
        line-height: 1;
      }

      .sub {
        color: var(--muted);
        margin-top: 12px;
        font-size: 1rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(94, 234, 212, 0.4);
        background: rgba(94, 234, 212, 0.08);
        color: var(--cyan);
        border-radius: 999px;
        padding: 11px 18px;
        margin-top: 18px;
        font-weight: 800;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-top: 22px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px 18px 16px;
      }

      .version {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .version-badge {
        min-width: 48px;
        height: 48px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        font-weight: 900;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .tag {
        border-radius: 999px;
        padding: 6px 8px;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-weight: 800;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .tag.active { background: rgba(124,247,163,0.08); color: var(--green); }
      .tag.ready { background: rgba(94,234,212,0.08); color: var(--cyan); }

      .title {
        margin: 0 0 8px;
        font-size: 1.08rem;
      }

      .summary {
        color: var(--muted);
        font-size: 0.93rem;
        line-height: 1.6;
        margin: 0 0 12px;
      }

      .metrics {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .metric {
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.78rem;
      }

      .metric strong {
        display: block;
        margin-bottom: 4px;
      }

      .metric span {
        display: block;
        color: var(--muted);
      }

      .section {
        margin-top: 32px;
      }

      .section h2 {
        margin: 0 0 16px;
        font-size: clamp(1.3rem, 2.5vw, 2.1rem);
        letter-spacing: -0.04em;
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .event {
        display: grid;
        grid-template-columns: 180px 1fr auto;
        gap: 14px;
        align-items: center;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 12px;
        padding: 12px 14px;
      }

      .event .step {
        color: var(--cyan);
        font-weight: 800;
      }

      .event .result {
        font-weight: 700;
      }

      .event .note {
        color: var(--muted);
        font-size: 0.82rem;
      }

      .status-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 18px;
      }

      .panel {
        background: var(--panel-strong);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 1.08rem;
      }

      .panel p, .panel ul {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
      }

      ul {
        padding-left: 18px;
      }

      .foot {
        margin-top: 28px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }

      @media (max-width: 700px) {
        .event {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <div class="eyebrow">AI safety / self-limiting / recovery</div>
        <h1>RD Theory V10.0.0</h1>
        <div class="sub">V10.0.0 is the only supported version. V1–V9 are archived/reference only.</div>
        <div class="status-pill">Support status: V10.0.0</div>
      </header>

      <main>
        <section id="cards" class="grid"></section>

        <section class="section">
          <h2>Safety timeline</h2>
          <div id="timeline" class="timeline"></div>
        </section>

        <section class="section status-row">
          <div class="panel">
            <h3>Core message</h3>
            <p id="summary-message"></p>
          </div>

          <div class="panel">
            <h3>Operating principles</h3>
            <ul id="principles"></ul>
          </div>
        </section>
      </main>

      <div class="foot">RD Theory · Streaming 100 x1000</div>
    </div>

    <script>
      fetch('./dashboard-data.json')
        .then(response => response.json())
        .then(data => {
          const cards = document.getElementById('cards');
          const timeline = document.getElementById('timeline');
          const summary = document.getElementById('summary-message');
          const principles = document.getElementById('principles');

          summary.textContent = data.summary.message;

          data.principles.forEach((item) => {
            const li = document.createElement('li');
            li.textContent = item;
            principles.appendChild(li);
          });

          data.versions.forEach((version) => {
            const card = document.createElement('article');
            card.className = 'card';
            card.innerHTML = `
              <div class="version">
                <div class="version-badge" style="background:${version.color}22; border-color:${version.color}66; color:${version.color};">${version.name}</div>
                <span class="tag ${version.status === 'RECOVERY READY' ? 'ready' : 'active'}">${version.status}</span>
              </div>
              <h3 class="title">${version.title}</h3>
              <p class="summary">${version.summary}</p>
              <div class="metrics">
                ${Object.entries(version.metrics).map(([key, value]) => `
                  <div class="metric">
                    <strong>${key.replace(/_/g, ' ')}</strong>
                    <span>${value}</span>
                  </div>
                `).join('')}
              </div>
            `;
            cards.appendChild(card);
          });

          data.events.forEach((event) => {
            const row = document.createElement('div');
            row.className = 'event';
            row.innerHTML = `
              <div class="step">${event.name}</div>
              <div class="result">${event.result}</div>
              <div class="note">${event.notes}</div>
            `;
            timeline.appendChild(row);
          });
        })
        .catch((err) => {
          console.error('Failed to load dashboard data', err);
          document.getElementById('summary-message').textContent =
            'V10.0.0 is the only supported version. V1–V9 are archived/reference only. Dashboard data could not be loaded.';
        });
    </script>
  </body>
</html>
